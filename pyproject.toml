[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcat"
version = "0.1.0"
description = "Organization-specific catalog of verified Python code patterns: canonicalizer, CLI and validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.5,<3",
    # pytest is a runtime dependency: `pcat validate` runs each pattern's tests.
    "pytest>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Everything the catalog's patterns import (union of every pattern.yaml `requires`;
# tests/test_catalog_requires.py keeps them in sync). CI installs it.
catalog = [
    "pyjwt>=2.8,<3",
    "requests>=2.31,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
pcat = "pcat.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The tool's own tests plus the v2.2 catalog-review variants (which skip when
# their third-party libraries are missing). Catalog pattern tests all import a
# module named `impl`, so they run one folder at a time via `pcat validate`.
testpaths = ["tests", "docs/catalog-review/variants"]
