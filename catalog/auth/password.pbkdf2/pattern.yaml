id: auth.password.pbkdf2
version: 1
title: Hash and verify passwords (PBKDF2-HMAC-SHA256)
summary: hash_password stores a salted PBKDF2-HMAC-SHA256 hash with its iteration count (at least 600,000); verify_password checks it in constant time; needs_rehash says when to upgrade an old hash.
category: auth
variant_of: auth.password
behavior:
  algorithm: pbkdf2_hmac_sha256
  min_iterations: 600000
  iterations_stored_in_hash: true
  format: pbkdf2_sha256$iterations$salt_b64$key_b64
  salt_bytes: 16
  compare: constant_time
  malformed_hash: returns_false
  exports: hash_password+verify_password+needs_rehash
entry_point: hash_password
owner: "@platform-team"
status: active
replaced_by: null
keep_annotations: true
fingerprint: 6aa1d0682d282360563b4669d7adec56e4f1f916617d70096a3b8c76ee9686d7
exports:
- verify_password
- needs_rehash
keywords:
- password
- hash
- hashing
- verify
- login
- credentials
- pbkdf2
- salt
- signup
- store password
- rehash
- authentication
use_when: Store user passwords as salted PBKDF2 hashes at sign-up, check them at login in constant time,
  and upgrade old hashes after a successful login.
usage: |-
  stored = hash_password(plain_password)          # at sign-up
  if verify_password(attempt, stored):             # at login
      if needs_rehash(stored):
          stored = hash_password(attempt)
guards:
- kind: must_call
  names: [hashlib.pbkdf2_hmac, os.urandom]
  reason: PBKDF2-HMAC with a random salt from the operating system
- kind: must_not_call
  names: [hashlib.md5, hashlib.sha1, random.randbytes, random.getrandbits, random.random]
  reason: no fast hashes and no predictable salts
- kind: must_raise
  names: [ValueError]
  reason: refuses iteration counts outside the reviewed bounds
- kind: min_value
  target: MIN_ITERATIONS
  value: 600000
  reason: OWASP 2023 minimum for PBKDF2-HMAC-SHA256
- kind: min_value
  target: iterations
  value: 600000
  reason: the default work factor for new hashes
- kind: must_call
  names: [hmac.compare_digest]
  function: verify_password
  reason: constant-time comparison of the derived key
- kind: must_catch
  names: [ValueError, TypeError]
  function: verify_password
  reason: a malformed stored hash returns False instead of raising
- kind: max_value
  target: MAX_ITERATIONS
  value: 10000000
  function: verify_password
  reason: bounds the CPU a tampered stored hash can demand
- kind: must_not_call
  names: [hashlib.md5, hashlib.sha1]
  function: verify_password
  reason: no fast hashes
