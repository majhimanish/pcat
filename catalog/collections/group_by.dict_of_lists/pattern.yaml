id: collections.group_by.dict_of_lists
version: 1
title: Group by key (dict of lists)
summary: Group items into a dict mapping key(item) to the list of items with that key.
category: collections
variant_of: collections.group_by
behavior:
  result: dict_of_lists
  key_order: first_seen
  item_order: preserved
  input: any_iterable
entry_point: group_by
owner: "@platform-team"
status: active
replaced_by: null
keep_annotations: true
fingerprint: 68a881fa849c71ad539062fde96eb18497ec0f064acc007636aded7f84c6e441
keywords:
- group by
- grouping
- bucket
- partition
- categorize
- key function
- dict of lists
- aggregate
- collections
- unsorted
use_when: Split an iterable into lists keyed by a computed key, keeping keys in first-seen order and items
  in input order, without sorting first (unlike itertools.groupby).
usage: |-
  groups = group_by(orders, key=lambda order: order.customer_id)
  for customer_id, customer_orders in groups.items():
      ...
