id: text.slugify.ascii
version: 1
title: Slugify (ASCII)
summary: Turn text into a lowercase ASCII slug of letters and digits joined by a separator.
category: text
variant_of: text.slugify
behavior:
  charset: ascii
  case: lower
  non_ascii: transliterate_or_drop
  separator: configurable_default_hyphen
  collapse_separators: true
  strip_edges: true
entry_point: slugify
owner: "@platform-team"
status: active
