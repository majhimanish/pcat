id: config.env.load_settings
version: 1
title: Load settings from environment variables with a schema
summary: Parse environment variables described by a caller-supplied schema of (parser, default) pairs; defaults for missing values, ... marks required ones, every problem is reported at once and secret values are never echoed.
category: config
variant_of: config.env
behavior:
  style: caller_supplied_schema
  required_marker: ellipsis
  errors: collect_all_then_value_error
  secret_values_in_errors: never
  source: injectable_mapping_default_os_environ
  result_keys: lower_case_variable_names
  exports: load_settings+parse_bool
entry_point: load_settings
owner: "@platform-team"
status: active
replaced_by: null
keep_annotations: true
fingerprint: 714b9e2489e151c5464aad756e97eb8ca007edd963b12e82bd940ccc9d15879f
exports:
- parse_bool
keywords:
- environment variables
- env
- config
- configuration
- settings
- os.environ
- defaults
- validate
- startup
- parse
- secrets
use_when: Load an application's settings from environment variables at startup with defaults, type parsing
  and required values, reporting every invalid value at once.
usage: |-
  settings = load_settings({"DATABASE_URL": (str, ...), "PORT": (int, 8000),
                            "DEBUG": (parse_bool, False)}, secret_names=("DATABASE_URL",))
guards:
- kind: must_raise
  names: [ValueError]
  reason: invalid configuration fails at startup, listing every problem
- kind: must_catch
  names: [ValueError, TypeError]
  reason: parser errors are collected per variable instead of stopping at the first
- kind: must_not_call
  names: [eval, exec, print]
  reason: environment values (secrets) are never evaluated or printed
- kind: must_raise
  names: [ValueError]
  function: parse_bool
  reason: unknown spellings are rejected, not read as false
- kind: must_not_call
  names: [eval, bool]
  function: parse_bool
  reason: bool("false") is True; only explicit spellings are accepted
