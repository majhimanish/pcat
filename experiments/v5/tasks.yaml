# v5 tasks (Part D). Each task removes real top-level functions from a fresh copy of the
# app at its pinned commit; the removed code is the reference. `pattern` is the catalog
# pattern that covers it (null for negatives). `relation`: sibling = the pattern was
# promoted from another occurrence that stays in the repo; same = the pattern was
# promoted from this very function (the only occurrence).
# `need` is the one-sentence description given to the request generator.
apps:
  healthchecks:
    hc_add_victorops:
      kind: pattern
      file: hc/integrations/victorops/views.py
      remove: [add]
      pattern: integrations.add_url_channel
      relation: sibling
      need: >-
        In the healthchecks Django app, the VictorOps integration needs its view that lets a
        logged-in user add a VictorOps webhook URL to one of their projects.
    hc_verify_email:
      kind: pattern
      file: hc/lib/emails.py
      remove: [verify_email]
      pattern: emails.templated_send
      relation: sibling
      need: >-
        In the healthchecks app, the email module needs a function that sends the
        "verify your email address" message to a given address with a template context.
    hc_check_for_user:
      kind: pattern
      file: hc/front/views.py
      remove: [_get_check_for_user, _get_rw_check_for_user]
      pattern: access.channel_for_user
      relation: sibling
      need: >-
        In the healthchecks app's front-end views, the helpers that load a check by its code
        for the current user (owner, member or superuser) and refuse write access to read-only
        members are missing.
    hc_api_authorize:
      kind: pattern
      file: hc/api/decorators.py
      remove: [authorize]
      pattern: api.authorize_read
      relation: sibling
      need: >-
        In the healthchecks API, write endpoints need a decorator that authenticates requests
        with a read-write project API key taken from the X-Api-Key header or the JSON body.
    hc_require_setting:
      kind: pattern
      file: hc/front/decorators.py
      remove: [require_setting]
      pattern: views.require_setting
      relation: same
      need: >-
        In the healthchecks app, integration views need a decorator that hides a view with a
        404 unless a given Django setting is enabled.
    hc_allow_redirect:
      kind: pattern
      file: hc/accounts/views.py
      remove: [_allow_redirect]
      pattern: accounts.allow_redirect
      relation: same
      need: >-
        In the healthchecks login flow, the accounts views need a check that decides whether a
        redirect target passed after login is safe to follow.
    hc_format_duration:
      kind: negative
      file: hc/lib/date.py
      remove: [format_duration]
      pattern: null
      need: >-
        In the healthchecks app, the date helpers need a function that turns a timedelta into
        text like "2 hours 30 minutes" or "8 days".
    hc_match_keywords:
      kind: negative
      file: hc/lib/string.py
      remove: [match_keywords]
      pattern: null
      need: >-
        In the healthchecks app, the string helpers need a function that tells whether any of
        a comma-separated list of keywords occurs in a piece of text.
  ctfd:
    ctfd_registered_only:
      kind: pattern
      file: CTFd/utils/decorators/__init__.py
      remove: [registered_only]
      pattern: decorators.authed_only
      relation: sibling
      need: >-
        In the CTFd Flask app, some pages need a decorator that only lets users with an
        account through and sends everyone else to the registration page.
    ctfd_reset_token:
      kind: pattern
      file: CTFd/utils/security/email.py
      remove: [generate_password_reset_token, verify_reset_password_token, remove_reset_password_token]
      pattern: security.email_confirm_token
      relation: sibling
      need: >-
        In CTFd, the password reset flow needs functions to create a secret token for an email
        address, look the address up again from the token, and invalidate the token.
    ctfd_mailserver:
      kind: pattern
      file: CTFd/utils/config/__init__.py
      remove: [mailserver]
      pattern: config.mail_provider_configured
      relation: sibling
      need: >-
        In CTFd's config helpers, the app needs a function that says whether an SMTP mail
        server is configured, in the app config or in the admin settings.
    ctfd_team_score:
      kind: pattern
      file: CTFd/utils/user/__init__.py
      remove: [get_team_score]
      pattern: user.cached_lookup
      relation: sibling
      need: >-
        In CTFd's user helpers, templates need a cached function that returns a team's score
        by team id.
    ctfd_ratelimit:
      kind: pattern
      file: CTFd/utils/decorators/__init__.py
      remove: [ratelimit]
      pattern: decorators.ratelimit
      relation: same
      need: >-
        In CTFd, the login, registration and team forms need a decorator that limits how many
        POST requests a client IP can make to an endpoint within a time window.
    ctfd_linear_decay:
      kind: pattern
      file: CTFd/plugins/challenges/decay.py
      remove: [linear]
      pattern: challenges.decay_linear
      relation: sibling
      need: >-
        In CTFd's challenge plugin, the scoring code needs a function that lowers a challenge's
        value linearly with the number of solves, without going below its minimum.
    ctfd_get_ip:
      kind: negative
      file: CTFd/utils/user/__init__.py
      remove: [get_ip]
      pattern: null
      need: >-
        In CTFd, the app needs a function that returns the real client IP address of the
        current request, trusting only the configured proxies.
    ctfd_ordinalize:
      kind: negative
      file: CTFd/utils/humanize/numbers.py
      remove: [ordinalize]
      pattern: null
      need: >-
        In CTFd, the scoreboard needs a function that turns a number into its ordinal text
        such as 1st, 2nd, 3rd or 11th.
  lnbits:
    lnbits_valid_email:
      kind: pattern
      file: lnbits/helpers.py
      remove: [is_valid_email_address]
      pattern: validators.regex_match
      relation: sibling
      need: >-
        In the LNbits FastAPI app, the helpers need a function that checks whether a string is
        a valid email address before an account is updated.
    lnbits_account_by_email:
      kind: pattern
      file: lnbits/core/crud/users.py
      remove: [get_account_by_email]
      pattern: crud.get_account_by_field
      relation: sibling
      need: >-
        In LNbits' user CRUD module, login and signup need an async function that fetches an
        account by its email address, ignoring case.
    lnbits_extensions_count:
      kind: pattern
      file: lnbits/core/crud/extensions.py
      remove: [get_installed_extensions_count]
      pattern: crud.count_rows
      relation: sibling
      need: >-
        In LNbits' extensions CRUD module, the admin page needs an async function that returns
        how many extensions are installed.
    lnbits_invoice_key:
      kind: pattern
      file: lnbits/decorators.py
      remove: [require_invoice_key]
      pattern: auth.require_api_key
      relation: sibling
      need: >-
        In LNbits, API endpoints that create invoices need a FastAPI dependency that requires
        a wallet's invoice key from the request header or query string.
    lnbits_super_user:
      kind: pattern
      file: lnbits/decorators.py
      remove: [check_super_user]
      pattern: auth.check_admin
      relation: sibling
      need: >-
        In LNbits, some admin endpoints need a FastAPI dependency that only lets the super user
        through and refuses everyone else with 403.
    lnbits_access_token:
      kind: pattern
      file: lnbits/helpers.py
      remove: [create_access_token]
      pattern: auth.lnbits_access_token
      relation: same
      need: >-
        In LNbits, the login endpoints need a function that creates the signed JWT access token
        stored in the session, expiring after the configured number of minutes.
    lnbits_version_ok:
      kind: negative
      file: lnbits/helpers.py
      remove: [is_lnbits_version_ok]
      pattern: null
      need: >-
        In LNbits, the extension installer needs a function that checks whether the running
        LNbits version lies within an extension's optional minimum and maximum versions.
    lnbits_camel_to_snake:
      kind: negative
      file: lnbits/helpers.py
      remove: [camel_to_snake]
      pattern: null
      need: >-
        In LNbits, the code generator needs a function that converts CamelCase names to
        snake_case.
