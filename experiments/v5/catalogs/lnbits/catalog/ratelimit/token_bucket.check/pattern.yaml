id: ratelimit.token_bucket.check
version: 1
title: Token-bucket rate limit check with retry-after
summary: Refill a per-key token bucket kept in a dict for the elapsed time, take the request's cost if available, and return (allowed, seconds until it would be allowed).
category: ratelimit
variant_of: ratelimit.token_bucket
behavior:
  returns: allowed_and_retry_after_seconds
  state: dict_key_to_tokens_and_last
  new_key: starts_full
  clock: monotonic_injectable_now
  clock_going_backwards: no_refill
  cost_over_capacity: raises_value_error
  concurrency: single_process_not_thread_safe
entry_point: check_rate_limit
owner: "@platform-team"
status: active
replaced_by: null
keep_annotations: true
fingerprint: db071827f76c8404571e5048036b7cac39c7d822bc2a3dd23944d54b941f3015
keywords:
- rate limit
- rate limiting
- throttle
- token bucket
- quota
- requests per second
- burst
- retry-after
- '429'
- limiter
use_when: Decide per client key whether a request is allowed under a rate limit, and how long to wait
  if not (for a 429 Retry-After), with state in a dict.
usage: |-
  allowed, retry_after = check_rate_limit(buckets, client_ip, capacity=20, refill_rate=5.0)
  if not allowed:
      return 429, {"Retry-After": str(math.ceil(retry_after))}
guards:
- kind: must_raise
  names: [ValueError]
  reason: rejects non-positive settings and costs above capacity
- kind: must_call
  names: [time.monotonic, max, min]
  reason: a monotonic clock; a clock that goes backwards adds nothing; tokens are capped at capacity
- kind: must_not_call
  names: [time.time]
  reason: wall-clock time can jump and refill or drain buckets
